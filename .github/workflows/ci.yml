name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Run tests
        run: swift test
      - name: Build application bundle
        run: ./scripts/build-app.sh
      - name: Verify application signature
        run: codesign --verify --deep --strict --verbose=2 dist/LidSwitch.app
